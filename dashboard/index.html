<!DOCTYPE html>
<html lang="en" class="bg-slate-50 dark:bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2315803d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='3' rx='2'/><path d='M3 9h18'/><path d='M9 21V9'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACASH Research Dashboard · Observability &amp; Evidence Tooling</title>
    <meta name="description" content="ACASH Research and Validation Dashboard. Observability, evidence lineage, and statistical audit inspection. Read-only research tooling." />
    <!-- Typography: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Theme Anti-Flash Initialization -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('acash_theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-slate-200 dark:selection:bg-slate-800 min-h-screen">
    <div id="root" class="min-h-screen bg-slate-50 dark:bg-slate-950"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
