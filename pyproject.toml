[project]
name = "acash"
version = "0.1.0"
description = "Automated Capital Allocation System - Sovereign Quantitative Foundation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [

    { name = "ACASH Core Engineering" }
]
dependencies = [
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "structlog>=23.1.0",
    "duckdb>=1.0.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "scipy>=1.12.0",
    "nautilus-trader==1.231.0",
]

[project.optional-dependencies]
portfolio-skfolio = [
    "skfolio>=1.0.3",
]
portfolio-cvxpy = [
    "cvxpy>=1.9.2",
]
portfolio-all = [
    "skfolio>=1.0.3",
    "cvxpy>=1.9.2",
]


[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "nautilus: Real unmocked NautilusTrader execution and integration tests",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cryptography.*", "pyarrow.*", "pandas.*", "duckdb.*", "nautilus_trader.*"]
ignore_missing_imports = true


