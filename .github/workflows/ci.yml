# ACASH CI — hermetic tier + static typing (no secrets, no network tests).
#
# T1-HERMETIC must pass from a fresh clone with no hidden local files:
# it excludes non_hermetic (live repo/env), native_mt5 (optional native
# package), sealed_data (untracked sealed datasets), and dashboard
# (node-side contracts run in their own toolchain).
#
# NOTE on tests/unit/execution/mt5: those modules hard-import the optional
# MetaTrader5 native package, so collection itself fails without it. The
# `-m "not native_mt5"` filter alone cannot prevent the import; the explicit
# --ignore below is therefore required in lockfile-faithful environments
# (the mark documents intent; the ignore enforces collectability).
#
# Python support matrix: pyproject.toml declares requires-python
# ">=3.12,<3.15", so T1 runs on every declared interpreter (3.12 caught a
# real eager-annotation NameError that 3.14's lazy annotations masked).
#
# Action pins are full immutable commit SHAs verified against the official
# repositories at workflow creation (2026-10-02):
# - actions/checkout v7.0.1 = 3d3c42e5aac5ba805825da76410c181273ba90b1
# - astral-sh/setup-uv v10.2.0 = c18668ad3cf93ea998bef934396af7bb5c839dc7

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  t1-hermetic:
    name: T1 hermetic pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Hermetic test tier
        run: >-
          uv run pytest -q --tb=line
          -m "not non_hermetic and not native_mt5 and not sealed_data and not dashboard"
          --ignore=tests/unit/execution/mt5

  t1-hermetic-gate:
    name: T1 hermetic gate
    runs-on: ubuntu-latest
    needs: [t1-hermetic]
    steps:
      - run: echo "All T1 matrix members green."

  mypy:
    name: MyPy strict
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Static typing
        run: uv run mypy src/ tests/
