# ACASH CI — hermetic tier + static typing (no secrets, no network tests).
#
# T1-HERMETIC must pass from a fresh clone with no hidden local files:
# it excludes non_hermetic (live repo/env), native_mt5 (optional native
# package), sealed_data (untracked sealed datasets), and dashboard
# (node-side contracts run in their own toolchain).
#
# NOTE on tests/unit/execution/mt5: those modules hard-import the optional
# MetaTrader5 native package, so collection itself fails without it. The
# `-m "not native_mt5"` filter alone cannot prevent the import; the explicit
# --ignore below is therefore required in lockfile-faithful environments
# (the mark documents intent; the ignore enforces collectability).

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  t1-hermetic:
    name: T1 hermetic pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Hermetic test tier
        run: >-
          uv run pytest -q --tb=line
          -m "not non_hermetic and not native_mt5 and not sealed_data and not dashboard"
          --ignore=tests/unit/execution/mt5

  mypy:
    name: MyPy strict
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Static typing
        run: uv run mypy src/ tests/
